<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Reviews - Airbnb Customer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="store.js"></script>
    <script src="api.js"></script>
    <script src="router.js"></script>
    <style>
        body {
            background: linear-gradient(to bottom, #E8F4FD, #D1E7F0);
            font-family: 'Inter', sans-serif;
        }
        .star-rating {
            color: #fbbf24;
        }
    </style>
</head>
<body class="min-h-screen">
    <!-- HEADER -->
    <header class="w-full flex items-center justify-between px-6 py-4 bg-white shadow-md fixed top-0 z-50">
        <div class="flex items-center gap-4">
            <button onclick="window.location.href='customer-dashboard.html'" class="text-gray-600 hover:text-gray-800">← Back to Dashboard</button>
            <h1 class="font-bold text-xl text-gray-800">My Reviews</h1>
        </div>
    </header>

    <div class="max-w-4xl mx-auto pt-24 px-6">
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-2xl font-bold mb-6">Your Reviews</h2>
            
            <div class="space-y-6" id="reviewsContainer" aria-live="polite">
                <p class="text-gray-500">Loading your reviews…</p>
            </div>
        </div>
    </div>

    <script>
        // Check authentication
        document.addEventListener('DOMContentLoaded', async function() {
            const isLoggedIn = localStorage.getItem('isLoggedIn');
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            if (!isLoggedIn || user.role !== 'customer') {
                window.location.href = 'auth.html';
                return;
            }

            const container = document.getElementById('reviewsContainer');
            try {
                const reviews = await api.getReviews();
                if (!Array.isArray(reviews) || reviews.length === 0) {
                    container.innerHTML = '<p class="text-gray-500">You have not reviewed a completed stay yet.</p>';
                    return;
                }

                container.replaceChildren();
                reviews.forEach((review) => {
                    const card = document.createElement('article');
                    card.className = 'border rounded-lg p-4';

                    const property = document.createElement('h3');
                    property.className = 'font-semibold text-gray-800';
                    property.textContent = review.property_title || 'Property';

                    const location = document.createElement('p');
                    location.className = 'text-sm text-gray-600 mb-2';
                    location.textContent = review.property_location || '';

                    const stars = document.createElement('p');
                    stars.className = 'star-rating mb-2';
                    stars.setAttribute('aria-label', `${review.rating} out of 5 stars`);
                    stars.textContent = `${'★'.repeat(review.rating)}${'☆'.repeat(5 - review.rating)}`;

                    const comment = document.createElement('p');
                    comment.className = 'text-gray-700';
                    comment.textContent = review.comment;

                    const createdAt = document.createElement('p');
                    createdAt.className = 'text-xs text-gray-400 mt-2';
                    createdAt.textContent = `Reviewed on ${new Date(review.created_at).toLocaleDateString()}`;

                    card.append(property, location, stars, comment, createdAt);
                    container.appendChild(card);
                });
            } catch (error) {
                container.textContent = error.message || 'Could not load your reviews. Please try again.';
            }
        });
    </script>
</body>
</html>
