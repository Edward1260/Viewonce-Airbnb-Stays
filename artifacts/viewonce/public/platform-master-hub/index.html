<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Platform Master Hub | ViewOnce</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #080b18; color: #f8f1e5; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 10%, rgba(216, 177, 91, .18), transparent 34%), radial-gradient(circle at 90% 80%, rgba(56, 124, 132, .18), transparent 36%), #080b18; }
    main { width: min(100%, 680px); padding: clamp(32px, 7vw, 72px); border: 1px solid rgba(233, 204, 137, .28); border-radius: 28px; background: rgba(18, 25, 44, .84); box-shadow: 0 30px 100px rgba(0,0,0,.42); text-align: center; }
    .mark { width: 72px; height: 72px; display: grid; place-items: center; margin: 0 auto 28px; border-radius: 22px; color: #17120a; background: linear-gradient(135deg, #ecd18b, #a87937); font-size: 30px; }
    p { color: rgba(248, 241, 229, .68); line-height: 1.7; }
    a { display: inline-flex; align-items: center; justify-content: center; margin-top: 18px; padding: 14px 24px; border-radius: 999px; color: #17120a; background: linear-gradient(135deg, #ecd18b, #b58641); font-weight: 700; text-decoration: none; }
    small { display: block; margin-top: 22px; color: rgba(248, 241, 229, .45); }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <p style="margin:0; color:#e6c878; letter-spacing:.24em; text-transform:uppercase; font-size:11px;">Private operations</p>
    <h1>Platform Master Hub</h1>
    <p>This is the private control center for ViewOnce. Customer accounts do not have access to this area.</p>
    <a href="login.html">Continue to secure login</a>
    <small>Fresh authentication is required for every new Platform Master session.</small>
  </main>
</body>
</html>
